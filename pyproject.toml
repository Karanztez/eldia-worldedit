[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endstone-eldia-worldedit"
version = "0.1.2"
description = "Full-featured WorldEdit plugin port for Endstone (Minecraft Bedrock)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["endstone>=0.11"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.entry-points."endstone"]
eldia_worldedit = "eldia_worldedit:WorldEditPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/eldia_worldedit"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
