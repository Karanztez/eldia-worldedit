name: Build Eldia WorldEdit

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip build pytest ruff endstone
          python -m pip install -e . --no-deps
      - name: Lint and test
        run: |
          ruff check src tests
          pytest -v --tb=short
      - name: Build wheel
        run: |
          python -m build --wheel --outdir dist-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: eldia-worldedit-wheel
          path: dist-artifacts/*.whl

  release:
    needs: [build-and-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: eldia-worldedit-wheel
          path: release-assets
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/*.whl
